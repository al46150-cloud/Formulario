<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de citas médicas </title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
           <fieldset>
            <legend>
            
                <h1>Agenda tu cita médica</h1>
            </legend>

                 Nombre de pasiente: <input type="text" name="nombre" size="30" required>
                 <br>
                 Fecha: <input type="date" name="fecha" >
                 <br>
                 Mes: <input type="month" id="mes" name="mes" required>
                 <br>
                 Semana del año: <input type="week" id="semana" name="semana" required>
                 <br>
                  <label for="hora">Hora estimada</label>
                  <input type="time" id="hora" name="hora" required>
                  <br>
                  <label for="motivo" >Motivo de la cita</label>
                  <select id="motivo" name="motivo" required>
                  <option value="">Selecciona una opción
                  </option>
                   <option value="revision">revisión general
                  </option>
                   <option value="consulta">consulta médica
                  </option>
                   <option value="seguimiento">seguimiento médico
                  </option>
                   <option value="otro">otro
                  </option>
                  </select>
                  <br>
                  <div class="botones">
                    <button class="enviar" type="submit">enviar solicitud</button>
                    <button type="reset">cancelar</button>
                  </div>
 
           </fieldset>
    

</body>
</html>
