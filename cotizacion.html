<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización</title>
</head>
<body>

    <fieldset>
        <legend>
    <h1>Solicitud de cotización</h1>
        </legend>

        <p>Completa los datos para solicitar una cotización de productos.</p>
        <br>
        <br>

        <label for="nombre">Nombre del cliente:</label>

        <input type="text" id="nombre" name="nombre" required>
        <br>
        <br>

        <label for="correo">Correo electrónico:</label>

        <input type="email" id="correo" name="correo" required>
               <br>
               <br>

        <label for="producto">Producto que deseas comprar:</label>

        <select id="producto" name="producto" required>

            <option value="">Selecciona un producto</option>

            <option value="cuadernos">Cuadernos</option>

            <option value="plumas">Plumas</option>

            <option value="mochilas">Mochilas</option>

            <option value="carpetas">Carpetas</option>

        </select>

        <br>
        <br>
        <label for="cantidad">Cantidad de artículos (mínimo 5, máximo 20):</label>

        <input type="number" id="cantidad" name="cantidad" min="5" max="20" step="1" placeholder="Escribe entre 5 y 20" required>
        <br>
        <br>

        <label for="comentarios">Comentarios adicionales:</label>

        <textarea id="comentarios" name="comentarios"

                  rows="2" placeholder="Escribe alguna especificación"></textarea>

                  <br>
        <div class="botones">

            <button class="enviar" type="submit">Solicitar cotización</button>

            <button type="reset">Cancelar</button>

        </div>
    </fieldset>
 
     </form>
</body>
</html>
