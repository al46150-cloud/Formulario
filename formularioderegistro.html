<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de usuario</title>
</head>
<body>
           <fieldset>

        <legend>
                 <h1>Registro de usuarios</h1>

            </legend>
 
            <label for="nombre">Nombre completo:</label>

        <input type="text" id="nombre" name="nombre" required>

        <br>
        <br>

        <label for="correo">Correo electrónico:</label>

        <input type="email" id="correo" name="correo" required>
        <br>
        <br>

        <label for="contraseña">Contraseña:</label>

        <input type="password" id="contraseña" name="contraseña" minlength="5" maxlength="8"

               required>
               <br>
               <br>

        <label for="confirmar">Confirmar contraseña:</label>

        <input type="password" id="confirmar" name="confirmar" minlength="5" maxlength="8" required>

        <div class="botones">

            <button class="enviar" type="submit">Registrarse</button>

            <button type="reset">Cancelar</button>

        </div>

    </form>

    <script>

        const formulario = document.querySelector("form");

        formulario.addEventListener("submit", function(event) {

            const contraseña= document.getElementById("contrasena").value;

            const confirmar=document.getElementById("confirmar").value;

            if (contrasena !== confirmar) {
            event.preventDefault();
            alert("Las contraseñas no coinciden.");}
             });

             </script>

            </fieldset>
</body>
</html>
